global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'payment-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['payment_service:8000']
        labels:
          service: 'payment-service'
          environment: 'production'

  - job_name: 'fraud-detection-engine'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['fraud_service:8001']
        labels:
          service: 'fraud-service'
          environment: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
